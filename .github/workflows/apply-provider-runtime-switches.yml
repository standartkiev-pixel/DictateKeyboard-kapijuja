name: Apply provider runtime switches

on:
  push:
    branches:
      - kapijuja/provider-runtime-switches

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: kapijuja/provider-runtime-switches
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/apply-provider-runtime-switches.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/dev/patrickgold/florisboard/app/AppPrefs.kt \
                  app/src/main/kotlin/dev/patrickgold/florisboard/app/settings/dictate/DictateProvidersScreen.kt \
                  app/src/main/kotlin/dev/patrickgold/florisboard/dictate/DictateController.kt \
                  app/src/main/res/values/strings.xml
          git diff --cached --check
          git commit -m "Add provider runtime switches"
          git push origin HEAD:kapijuja/provider-runtime-switches
