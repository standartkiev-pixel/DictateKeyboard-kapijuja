name: Dictate Kapijuja RC release

on:
  push:
    branches: ['release-v0.1.0-rc.7*']

permissions:
  contents: write

concurrency:
  group: dictate-kapijuja-v0.1.0-rc.7
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Audit release source and credentials
        run: bash scripts/release-audit.sh

      - name: Prevent controller growth and source corruption
        run: bash scripts/architecture-audit.sh

      # Android creates a new random debug key on every clean runner. A checked, explicitly public test
      # identity keeps prerelease APKs upgrade-compatible without using or exposing the future production key.
      - name: Install pinned public prerelease signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/kapijuja-prerelease-debug.keystore.b64 \
            > "$HOME/.android/debug.keystore"
          echo "100a4ef0a4d5d2c702e5b9828f6fd71acb051fd61fc85c98ba14379cfd4700d2  $HOME/.android/debug.keystore" \
            | sha256sum --check --strict
          # Pass the verified path explicitly because hosted Android runners may redirect their
          # default preferences directory away from HOME; Gradle must not silently select another key.
          echo "KAPIJUJA_PRERELEASE_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Fetch checksum-pinned native STT runtime
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      - name: Compile phone and Wear
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Run all JVM unit tests
        run: |
          timeout 20m ./gradlew \
            :app:testDebugUnitTest \
            :lib:dictate-core:testDebugUnitTest \
            :wear:testDebugUnitTest \
            --stacktrace

      # Re-run only the network fault/cancellation class. The previous RC workflow accidentally
      # re-ran the entire dictate-core suite three times, adding about 25 minutes without increasing
      # coverage of the fault path we actually want to stress.
      - name: Repeat network fault tests
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Network fault suite attempt $attempt/3"
            timeout 5m ./gradlew :lib:dictate-core:testDebugUnitTest \
              --tests "dev.patrickgold.florisboard.dictate.provider.OpenAiCompatibleClientNetworkTest" \
              --rerun-tasks --stacktrace
          done

      - name: Strict Android lint for core and Wear
        run: |
          ./gradlew \
            :lib:dictate-core:lintDebug \
            :wear:lintDebug \
            --stacktrace

      # The phone module carries an upstream localization/API lint backlog. Generate its complete report
      # for every RC, then fail on the permission/lifecycle/resource IDs that can crash or leak at runtime.
      - name: Generate complete phone lint report
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Gate release-critical phone lint findings
        run: python3 scripts/gate-release-lint.py

      - name: Verify APK identity signature and size
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="dictate-kapijuja-v0.1.0-rc.7-test.apk"
          test -f "$source_apk"
          cp "$source_apk" "$release_apk"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk" | tee apk-signature.txt
          grep -qi "certificate SHA-256 digest: 22b02aed48a0ca0aeaa96e276e78ddefa000478edd824c8cb89da6575f068884" apk-signature.txt
          "$build_tools/aapt" dump badging "$release_apk" | tee apk-badging.txt
          grep -q "package: name='net.kapijuja.dictate.debug' versionCode='7'" apk-badging.txt

          size="$(stat -c '%s' "$release_apk")"
          test "$size" -lt 157286400
          sha="$(sha256sum "$release_apk" | cut -d' ' -f1)"
          echo "file=$release_apk" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Keep a short-lived Actions copy as a recovery path if GitHub's release-asset service has a
      # transient outage. This is the same verified APK that is uploaded to the public prerelease.
      - name: Preserve verified APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictate-kapijuja-v0.1.0-rc.7-test
          path: dictate-kapijuja-v0.1.0-rc.7-test.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish minimal tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_FILE: ${{ steps.apk.outputs.file }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          APK_SHA: ${{ steps.apk.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-rc.7"
          title='Dictate Kapijuja 0.1.0 RC7 — provider controls and stable suggestions'

          printf '%s\n' \
            'Seventh public test candidate of Dictate Kapijuja Keyboard.' \
            '' \
            'This prerelease uses the dedicated public Kapijuja test identity. It installs as net.kapijuja.dictate.debug and does not consume the future stable update/signing identity.' \
            '' \
            'Updates RC2 through RC6 in place using the same pinned public test certificate. Export settings and retained audio before any one-time migration from older incompatible debug builds; do not uninstall an existing compatible RC.' \
            '' \
            'AI provider settings now separate model selection from runtime behavior. Real-time transcription can be switched off without erasing the selected real-time model, and Automatic rewording can be switched off while keeping the manual magic-wand prompts and translation tools available.' \
            '' \
            'Candidate refresh ordering is now monotonic instead of millisecond-clock based. Cursor movement, the first keypress, direct glide suggestions and clears can no longer collide on the same timestamp and leave the Smartbar suggestion strip stale or empty.' \
            '' \
            'The long-form dictation, recording-input routing, retained-audio recovery and transcription watchdog work from RC6 remain intact. Development handoff material is now split into bounded task-specific context files so maintenance changes do not require loading the full project history.' \
            '' \
            'Validated before publishing:' \
            '- phone and Wear compilation;' \
            '- app, dictate-core and Wear unit tests;' \
            '- three repeated network fault/cancellation test runs;' \
            '- strict core/Wear lint and a release-critical phone permission/lifecycle/resource gate;' \
            '- Cloud/Billing and credential audit;' \
            '- APK package, signature, version code and size verification.' \
            '' \
            "APK size: $APK_SIZE bytes" \
            "SHA-256: $APK_SHA" \
            > release-notes.txt

          # Creating the release and uploading a ~124 MiB APK are deliberately separate operations.
          # GitHub's uploads service can return a transient 5xx after the release metadata has already
          # been accepted; separating them makes a retry idempotent instead of failing the whole RC.
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            created=false
            for attempt in 1 2 3; do
              echo "Release metadata attempt $attempt/3"
              if gh release create "$tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --target "$GITHUB_SHA" \
                  --title "$title" \
                  --notes-file release-notes.txt \
                  --prerelease; then
                created=true
                break
              fi
              sleep $((attempt * 10))
            done
            test "$created" = true
          else
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.txt \
              --prerelease
          fi

          uploaded=false
          for attempt in 1 2 3 4 5; do
            echo "APK upload attempt $attempt/5"
            if timeout 5m gh release upload "$tag" "$APK_FILE" \
                --repo "$GITHUB_REPOSITORY" --clobber; then
              uploaded=true
              break
            fi
            sleep $((attempt * 15))
          done
          test "$uploaded" = true

          # Do not call the run successful until the public release actually exposes the expected APK.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx "$APK_FILE"
