name: Apply suggestion strip consistency patch

on:
  push:
    branches:
      - kapijuja/suggestion-strip-consistency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: kapijuja/suggestion-strip-consistency
          fetch-depth: 0

      - name: Apply focused candidate-ordering patch
        run: python3 scripts/apply-suggestion-strip-consistency.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/dev/patrickgold/florisboard/ime/nlp/NlpManager.kt \
                  app/src/test/kotlin/dev/patrickgold/florisboard/ime/nlp/SuggestionRequestSequenceTest.kt
          git diff --cached --check
          git commit -m "Stabilize candidate refresh ordering"
          git push origin HEAD:kapijuja/suggestion-strip-consistency
