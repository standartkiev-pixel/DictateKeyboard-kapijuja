name: Fix provider switch save scope

on:
  push:
    branches:
      - kapijuja/provider-runtime-switches

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kapijuja/provider-runtime-switches
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/fix-provider-switch-save-scope.py
      - name: Check patch
        run: |
          git diff --check
          bash scripts/architecture-audit.sh
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/dev/patrickgold/florisboard/app/settings/dictate/DictateProvidersScreen.kt
          git commit -m "Persist provider runtime modes from screen scope"
          git push origin HEAD:kapijuja/provider-runtime-switches
