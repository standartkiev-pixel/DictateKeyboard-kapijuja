name: Dictate Kapijuja Android CI

on:
  push:
    branches: [main, kapijuja-bootstrap]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kapijuja-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Audit release source and credentials
        run: bash scripts/release-audit.sh

      # Use the same intentionally public test identity as prereleases. Without this step each clean
      # runner creates a random certificate and its debug artifact cannot update an earlier CI build.
      - name: Install pinned public prerelease signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/kapijuja-prerelease-debug.keystore.b64 \
            > "$HOME/.android/debug.keystore"
          echo "100a4ef0a4d5d2c702e5b9828f6fd71acb051fd61fc85c98ba14379cfd4700d2  $HOME/.android/debug.keystore" \
            | sha256sum --check --strict
          # Pass the verified path explicitly because Android runners may redirect their default
          # preferences directory away from HOME.
          echo "KAPIJUJA_PRERELEASE_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Fetch pinned native STT runtime
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      # Compile BOTH distributable Android surfaces. The Wear module is a separate application module;
      # building only :app can leave watch-only Kotlin errors completely invisible.
      - name: Build phone and Wear debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dictate-kapijuja-phone-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Wear debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dictate-kapijuja-wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # :lib:dictate-core owns the provider/network fault tests; :app alone does not execute them.
      # Keep Wear in the test graph too so a future watch-side unit test cannot silently be omitted.
      - name: Run app, core and Wear unit tests
        run: |
          ./gradlew             :app:testDebugUnitTest             :lib:dictate-core:testDebugUnitTest             :wear:testDebugUnitTest             --stacktrace
