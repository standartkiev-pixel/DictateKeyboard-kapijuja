name: Dictate Kapijuja Android CI

on:
  push:
    branches: [main, kapijuja-bootstrap]
  pull_request:

permissions:
  contents: read

concurrency:
  group: kapijuja-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Audit release source and credentials
        run: bash scripts/release-audit.sh

      - name: Prevent controller growth and source corruption
        run: bash scripts/architecture-audit.sh

      - name: Audit full settings backup includes API credentials
        run: python3 scripts/audit-backup-credentials.py

      # Use the same intentionally public test identity as prereleases. Without this step each clean
      # runner creates a random certificate and its debug artifact cannot update an earlier CI build.
      - name: Install pinned public prerelease signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/kapijuja-prerelease-debug.keystore.b64 \
            > "$HOME/.android/debug.keystore"
          echo "100a4ef0a4d5d2c702e5b9828f6fd71acb051fd61fc85c98ba14379cfd4700d2  $HOME/.android/debug.keystore" \
            | sha256sum --check --strict
          # Pass the verified path explicitly because Android runners may redirect their default
          # preferences directory away from HOME.
          echo "KAPIJUJA_PRERELEASE_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Fetch pinned native STT runtime
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh

      # User decision 2026-11-14: only build the compact arm64 phone APK on every CI run.
      # Wear OS sources remain in :wear for possible future use; do NOT compile it routinely.
      - name: Build compact phone debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Only the phone APK is built and installed; verify its pinned upgrade-compatible certificate.
      - name: Verify phone APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee apk-signature.txt
          grep -qi "certificate SHA-256 digest: 22b02aed48a0ca0aeaa96e276e78ddefa000478edd824c8cb89da6575f068884" apk-signature.txt

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: dictate-kapijuja-phone-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # :wear stays in source control but is deliberately excluded from routine builds/tests.
      # Shared provider/network fault tests still run in :lib:dictate-core.
      - name: Run phone and core unit tests
        run: |
          ./gradlew :app:testDebugUnitTest :lib:dictate-core:testDebugUnitTest --stacktrace
