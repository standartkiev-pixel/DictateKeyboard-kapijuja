name: Kapijuja Android CI

on:
  push:
    branches: [main, kapijuja-bootstrap]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Fetch pinned native STT runtime
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          ./tools/fetch-sherpa-onnx.sh
      - name: Build and unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
